<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Molly's Maths</title>
<meta name="description" content="Molly's Division Challenge: long division practice following the Irish primary maths curriculum.">
<meta name="theme-color" content="#14121E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Molly's Maths">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Fredoka:wght@400..600&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a dashboard (hero sheet, estimate + four moves, 100-tile progress map by curriculum level) and a play screen where a squared-copy page sits beside a prompt card and keypad. Each step owns one ink colour. */
:root{
  --bg:#F1EFF9; --paper:#FFFFFF; --grid:#DCE3F2; --card:#FFFFFF; --soft:#E8E4F6; --line:#DFDAF0;
  --ink:#24203A; --muted:#67628A; --on-accent:#FFFFFF;
  --div:#6C43EE; --div-deep:#4A26C2; --div-soft:#EDE7FF; --div-mid:#CBB9FF;
  --mul:#0A938E; --mul-soft:#DBF4F1;
  --sub:#E3405F; --sub-soft:#FDE5EA;
  --bring:#D98200; --bring-soft:#FFF0D4;
  --est:#2766D6; --est-soft:#E3ECFD;
  --star:#F3AD12; --bad:#C92F4B; --bad-soft:#FDE8EC;
  --shadow:0 1px 0 rgba(36,32,58,.04),0 10px 28px -14px rgba(76,48,170,.32);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'Fredoka','Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121E; --paper:#1D1A2B; --grid:#2B2840; --card:#1F1C2E; --soft:#2A2640; --line:#332E4C;
  --ink:#EDEAF8; --muted:#A49FC0; --on-accent:#16121F;
  --div:#A88BFF; --div-deep:#7458D6; --div-soft:#2C2450; --div-mid:#4C3B92;
  --mul:#36D2C0; --mul-soft:#16353A;
  --sub:#FF7590; --sub-soft:#3D1F2C;
  --bring:#FFBE3D; --bring-soft:#3A2D15;
  --est:#7FAAFF; --est-soft:#1C2A48;
  --star:#FFC531; --bad:#FF7590; --bad-soft:#3D1F2C;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#14121E; --paper:#1D1A2B; --grid:#2B2840; --card:#1F1C2E; --soft:#2A2640; --line:#332E4C;
  --ink:#EDEAF8; --muted:#A49FC0; --on-accent:#16121F;
  --div:#A88BFF; --div-deep:#7458D6; --div-soft:#2C2450; --div-mid:#4C3B92;
  --mul:#36D2C0; --mul-soft:#16353A;
  --sub:#FF7590; --sub-soft:#3D1F2C;
  --bring:#FFBE3D; --bring-soft:#3A2D15;
  --est:#7FAAFF; --est-soft:#1C2A48;
  --star:#FFC531; --bad:#FF7590; --bad-soft:#3D1F2C;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--div);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0}
.big{background:var(--div);color:var(--on-accent);border:0;border-radius:14px;padding:14px 22px;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 var(--div-deep);transition:transform .08s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--div-deep)}
.ghost{background:transparent;border:2px solid var(--line);border-radius:14px;padding:12px 18px;font-weight:800;color:var(--ink)}
.ghost:hover{border-color:var(--div);color:var(--div)}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--div)}

/* ---------- Home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:8px 32px}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:24px}}
.eyebrow{font-weight:800;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--div);margin-bottom:10px}
h1{font-weight:800;font-size:clamp(2.3rem,6.2vw,3.7rem);line-height:1;letter-spacing:-.025em;margin-bottom:16px}
h1 .div{color:var(--div);font-weight:800}
.lede{max-width:46ch;color:var(--muted);font-size:1.06rem;margin-bottom:24px}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.heroSheet{margin:0;justify-self:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.heroSheet .sheet{transform:rotate(-2.5deg)}
.heroSheet figcaption{font-family:var(--f-num);color:var(--muted);font-size:.95rem}

.secHead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.secHead h2{font-size:1.35rem;font-weight:800}
.secHead p{color:var(--muted);font-size:.92rem}
.estCard{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.estCard h3{font-size:1.05rem;font-weight:800;color:var(--x)}
.estCard p{font-size:.92rem;color:var(--muted);line-height:1.45;max-width:70ch}
.moves{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:36px}
@media (max-width:760px){.moves{grid-template-columns:repeat(2,minmax(0,1fr))}}
.move{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lt{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;background:var(--x-soft);color:var(--x)}
.move h3{font-size:1.05rem;font-weight:800;color:var(--x)}
.move p{font-size:.9rem;color:var(--muted);line-height:1.4}

.stats{display:flex;flex-wrap:wrap;gap:12px 36px;margin-bottom:18px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-num);font-weight:600;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat b small{font-size:1rem;color:var(--muted);font-weight:500}
.stat span{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.levels{margin-bottom:36px}
.lvl{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;padding-block:16px;border-top:1px solid var(--line);align-items:center}
@media (max-width:640px){.lvl{grid-template-columns:1fr;gap:10px}}
.lvl h3{font-size:1.08rem;font-weight:800}
.lvl .lnum{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--div)}
.lvl p{font-size:.88rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.tile{aspect-ratio:1;max-width:100%;min-width:0;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-family:var(--f-num);font-size:clamp(.66rem,1.8vw,.85rem);color:var(--muted);display:grid;place-items:center;padding:0;transition:transform .1s}
.tile:hover{transform:translateY(-2px);border-color:var(--div)}
.tile.s1{background:var(--div-soft);border-color:transparent;color:var(--div)}
.tile.s2{background:var(--div-mid);border-color:transparent;color:var(--ink)}
.tile.s3{background:var(--div);border-color:transparent;color:var(--on-accent);font-weight:600}
.tile.next{border:2.5px solid var(--div);color:var(--div);font-weight:600;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.08)}}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.84rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:var(--card);display:inline-block}
.legend i.s1{background:var(--div-soft);border-color:transparent}
.legend i.s2{background:var(--div-mid);border-color:transparent}
.legend i.s3{background:var(--div);border-color:transparent}

.grown{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.grown .insight{max-width:62ch;margin-block:4px 16px}
.bars{display:grid;gap:10px;max-width:560px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:12px;align-items:center;font-weight:700;font-size:.92rem}
.bar .track{height:14px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:inherit;background:var(--x)}
.bar b{font-family:var(--f-num);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.gfoot{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:18px;font-size:.88rem;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bad-soft);color:var(--ink);font-weight:700}
.confirm button{border:0;border-radius:10px;padding:8px 14px;font-weight:800}
.confirm .yes{background:var(--bad);color:var(--on-accent)}
.confirm .no{background:var(--card)}

/* ---------- Sheet (squared copy) ---------- */
.sheet{position:relative;flex:none;background-color:var(--paper);border-radius:14px;box-shadow:var(--shadow);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:var(--cell) var(--cell)}
.inner{position:absolute}
.c{position:absolute;width:var(--cell);height:var(--cell);display:grid;place-items:center;font-family:var(--f-num);font-weight:500;
  font-size:calc(var(--cell)*.64);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;border-radius:7px}
.c.dv{font-weight:600}
.c.q{color:var(--div);font-weight:600}
.c.p{color:var(--mul)}
.c.r{color:var(--sub)}
.c.b{color:var(--bring);font-weight:600}
.c.rl{color:var(--sub);font-size:calc(var(--cell)*.5);font-weight:600}
.c.minus{color:var(--muted)}
.c.hl-div{background:var(--div-soft)}
.c.hl-mul{background:var(--mul-soft)}
.c.hl-sub{background:var(--sub-soft)}
.c.hl-bring{background:var(--bring-soft);color:var(--bring)}
.c.slot{box-shadow:inset 0 0 0 2.5px var(--sc);background:var(--sc-soft);color:var(--sc);font-weight:600}
.slot-divide{--sc:var(--div);--sc-soft:var(--div-soft)}
.slot-multiply{--sc:var(--mul);--sc-soft:var(--mul-soft)}
.slot-subtract{--sc:var(--sub);--sc-soft:var(--sub-soft)}
.slot-bring{--sc:var(--bring);--sc-soft:var(--bring-soft);box-shadow:inset 0 0 0 2px var(--sc);background:transparent}
.c.slot.caret:empty::after{content:"";width:2px;height:52%;background:var(--sc);animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.dot{position:absolute;width:calc(var(--cell)*.16);height:calc(var(--cell)*.16);border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}
.dot.q{background:var(--div)}
.ln{position:absolute;background:var(--ink);border-radius:2px}
.bracket{position:absolute;overflow:visible}
.bracket path{stroke:var(--ink)}
.guide{position:absolute;width:0;border-left:2.5px dashed var(--bring)}
.guide::after{content:"";position:absolute;left:-7px;bottom:-2px;border:6px solid transparent;border-top:8px solid var(--bring)}
.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.drop{animation:drop .65s cubic-bezier(.5,0,.3,1.25) both}
@keyframes drop{from{transform:translateY(var(--dy));opacity:.5}to{transform:none;opacity:1}}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- Play ---------- */
.ptop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800;font-size:.9rem;white-space:nowrap}
.pinfo{text-align:center;min-width:0}
.pq{font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.plev{font-size:.8rem;color:var(--muted);font-weight:700}
.iconBtn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;color:var(--muted);flex:none}
.pbar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:14px 0 20px}
.pbar i{display:block;height:100%;background:var(--div);border-radius:inherit;transition:width .5s}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
@media (max-width:840px){.pgrid{grid-template-columns:minmax(0,1fr);gap:16px}}
.leftCol,.rightCol{min-width:0;display:flex;flex-direction:column;gap:16px}
.paperWrap{display:flex;justify-content:center;overflow-x:auto;padding:6px 4px 10px}

.prompt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.chip{text-align:center;white-space:nowrap;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 2px;border-radius:99px;background:var(--soft);color:var(--muted)}
.chip.on{background:var(--x);color:var(--on-accent)}
.chip.did{background:var(--x-soft);color:var(--x)}
.demoTag{font-size:.82rem;font-weight:800;color:var(--bring);background:var(--bring-soft);padding:6px 10px;border-radius:10px}
.note{font-size:.9rem;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.note svg{flex:none;margin-top:3px;color:var(--mul)}
.pre{font-size:.95rem;color:var(--muted)}
.pre b{color:var(--ink)}
.ask{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.25}
.ask .n{font-family:var(--f-num);font-weight:600;color:var(--x)}
.ask.est{color:var(--est)}
.sub{font-size:.92rem;color:var(--muted);margin-top:-6px}
.ansRow{display:flex;align-items:center;gap:12px}
.ansRow span.lbl{font-weight:800;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ans{display:inline-flex;align-items:center;justify-content:flex-end;min-width:3.2em;height:1.8em;padding:0 .35em;border-radius:12px;font-family:var(--f-num);font-weight:600;font-size:2rem;
  box-shadow:inset 0 0 0 2.5px var(--x);background:var(--x-soft);color:var(--x);font-variant-numeric:tabular-nums}
.ans:empty::after{content:"";width:2px;height:55%;background:var(--x);animation:blink 1s steps(2,start) infinite}
.estOpts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.estBtn{border:0;border-radius:14px;padding:10px 4px;background:var(--est-soft);color:var(--est);box-shadow:inset 0 0 0 2px var(--est);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.estBtn small{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.estBtn b{font-family:var(--f-num);font-size:1.5rem;font-weight:600;line-height:1.1}
.estBtn:disabled{opacity:.35;cursor:default;text-decoration:line-through}
.hint{font-size:.93rem;font-weight:700;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad)}
.hint.info{background:var(--soft);color:var(--muted)}
.pbtns{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.big.bringBtn{background:var(--bring);box-shadow:0 4px 0 color-mix(in srgb,var(--bring) 65%,var(--ink));color:var(--on-accent);width:100%}

.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{height:58px;border-radius:14px;border:0;background:var(--card);box-shadow:0 3px 0 var(--line),inset 0 0 0 1px var(--line);font-family:var(--f-num);font-size:1.65rem;font-weight:500;color:var(--ink);transition:transform .06s}
.key:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line),inset 0 0 0 1px var(--line)}
.key.go{background:var(--div);color:var(--on-accent);box-shadow:0 3px 0 var(--div-deep);font-family:var(--f-body);font-size:1.05rem;font-weight:800}
.key.go.bring{background:var(--bring)}
.key:disabled{opacity:.35;cursor:default}
@media (max-width:840px){.key{height:52px}}

.ladder{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ladHead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ladHead h3{font-size:.95rem;font-weight:800}
.ladHead .link{padding:0}
.ladCap{font-size:.84rem;color:var(--muted);margin-top:6px}
.ladGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.lc{font-family:var(--f-num);font-size:.98rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 9px;display:flex;justify-content:space-between;gap:6px;font-variant-numeric:tabular-nums;min-width:0}
.lc span{color:var(--muted)}
.lc.on{background:var(--mul-soft);border-color:var(--mul);color:var(--mul);font-weight:600}
.lc.on span{color:var(--mul)}

.done{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.stars{display:flex;gap:6px}
.stars svg{width:40px;height:40px}
.stars .on{fill:var(--star)}
.stars .off{fill:var(--soft)}
.res{font-family:var(--f-num);font-size:2rem;font-weight:500;line-height:1.1}
.res b{color:var(--div);font-weight:600}
.res em{font-style:normal;color:var(--sub);font-weight:600}
.chk{font-size:.95rem;color:var(--muted)}
.chk b{color:var(--mul)}
.chk i{font-style:normal;color:var(--est);font-weight:700}
.msg{font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.lvlDone{background:var(--div-soft);color:var(--div);font-weight:800;padding:8px 12px;border-radius:10px}
.done .big{width:100%}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<style>
/* ---------- App shell: home-screen app on iPad ---------- */
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{padding-top:max(20px,calc(env(safe-area-inset-top,0px) + 12px));padding-bottom:max(48px,calc(env(safe-area-inset-bottom,0px) + 32px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.key,.tile,.estBtn,.big,.ghost,.back,.iconBtn,.chip{-webkit-touch-callout:none}

/* ---------- Welcome ---------- */
#welcome{position:fixed;inset:0;z-index:100;overflow:hidden;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 90% at 50% 38%,#33236F 0%,#1B1540 45%,#0B0918 100%);color:#F4F1FF;
  transition:opacity .6s ease,transform .6s ease}
#welcome.leaving{opacity:0;transform:scale(1.06);pointer-events:none}
#sky{position:absolute;inset:0;width:100%;height:100%}
.floaters{position:absolute;inset:0;pointer-events:none}
.floaters span{position:absolute;bottom:-12vh;font-family:var(--f-num);font-weight:600;line-height:1;opacity:0;
  animation:float var(--t) linear var(--d) infinite}
@keyframes float{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translateY(-125vh) rotate(var(--r));opacity:0}}

  const cv=document.getElementById('sky'),ctx=cv.getContext('2d');

  let stars2=[],shoot=null,w=0,h=0,raf=0,running=true;

  function frame(t){

  if(still)frame(0);else raf=requestAnimationFrame(frame);

    const top=Object.keys(E).sort((a,b)=>E[b]-E[a])[0];
    insight={estimate:'Most slips so far are in Estimating. Rounding to friendly numbers (338 ÷ 7 is about 350 ÷ 7) is worth practising on its own.',
      divide:'Most slips so far are in Divide, which is judging how many times the divisor fits. Practising tables backwards (“how many 7s in 50?”) targets this directly.',
      multiply:'Most slips so far are in Multiply. That’s times tables rather than long division itself, so quick tables practice will lift the score fastest.',
      subtract:'Most slips so far are in Subtract, usually where renaming (borrowing) is needed. A few column-subtraction drills will help.'}[top];
  }
  const maxE=Math.max(1,E.estimate,E.divide,E.multiply,E.subtract);
  $('#home').innerHTML=`
  <header class="hero">
    <div>
      <p class="eyebrow">Long division · Irish primary maths curriculum</p>
      <h1>Molly’s <span class="div">Division</span> Challenge</h1>
      <p class="lede">100 questions that follow the primary maths curriculum, from 4th class revision to the 5th class goals: dividing by two-digit numbers and dividing decimals. Estimate first, then use the same four moves every time.</p>
      <div class="ctas">
        <button class="big" data-act="go">${goLabel}</button>
        <button class="ghost" data-act="demo">Watch an example</button>
      </div>
    </div>
    <figure class="heroSheet">${sheetHTML(demoP,{k:last,phase:'finish'},heroCell,{static:true})}<figcaption>935 ÷ 23 = 40 R15</figcaption></figure>
  </header>
  <div class="secHead"><h2>How every question works</h2><p>Estimate, then Divide → Multiply → Subtract → Bring down. Repeat.</p></div>
  <div class="estCard" style="--x:var(--est);--x-soft:var(--est-soft)"><div class="lt">E</div><div><h3>Estimate first</h3><p>Round to friendly numbers before you start. 338 ÷ 7 is about 350 ÷ 7 = 50, so the answer should be close to 50. At the end, check your answer is near your estimate.</p></div></div>
  <section class="moves">${moves.map(([p,l,t])=>`<div class="move" style="--x:var(--${COL[p]});--x-soft:var(--${COL[p]}-soft)"><div class="lt">${l}</div><h3>${NAME[p]}</h3><p>${t}</p></div>`).join('')}</section>
  <div class="secHead"><h2>Progress</h2><p>Tap any square to play that question.</p></div>
  <section class="stats">
    <div class="stat"><b>${done}<small> / 100</small></b><span>Done</span></div>
    <div class="stat"><b>${stars}<small> / 300</small></b><span>Stars</span></div>
    <div class="stat"><b>${done?Math.round(firstRight/done*100)+'%':'–'}</b><span>Right first time</span></div>
  </section>
  <section class="levels">
    ${LEVELS.map((L,li)=>`<div class="lvl"><div><div class="lnum">Level ${li+1} · ${L.tag}</div><h3>${L.name}</h3><p>${L.desc} Q${li*20+1}–${li*20+20}.</p></div>
      <div class="tiles">${Array.from({length:20},(_,j)=>{const i=li*20+j,r=store.results[i];const cls=r?'s'+r.best:(i===nx?'next':'');
        return `<button class="tile ${cls}" data-q="${i}" aria-label="Question ${i+1}${r?', '+r.best+' stars':''}">${i+1}</button>`;}).join('')}</div></div>`).join('')}
    <div class="legend"><span><i></i>Not done</span><span><i class="s1"></i>1 star</span><span><i class="s2"></i>2 stars</span><span><i class="s3"></i>3 stars, no slips</span></div>
  </section>
  <section class="grown">
    <div class="secHead"><h2>For grown-ups</h2><p>First attempts only</p></div>
    <p class="insight">${insight}</p>
    <div class="bars">${['estimate','divide','multiply','subtract'].map(p=>`<div class="bar" style="--x:var(--${COL[p]})"><span>${NAME[p]}</span><div class="track"><i style="width:${E[p]/maxE*100}%"></i></div><b>${E[p]}</b></div>`).join('')}</div>
    <div class="gfoot"><span>“Show me” used ${H} time${H===1?'':'s'}. Progress is saved on this device.</span>
      <button class="link" data-act="ask-clear">Clear progress</button><button class="link" data-act="ask-new">New set of 100</button></div>
    ${confirmKind?`<div class="confirm"><span>${confirmKind==='clear'?'Wipe all stars and results?':'Make 100 new questions and wipe all results?'}</span><button class="yes" data-act="${confirmKind==='clear'?'do-clear':'do-new'}">Yes</button><button class="no" data-act="cancel">Cancel</button></div>`:''}
  </section>`;
}
$('#home').addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-q]');if(!t)return;
  if(t.dataset.q!==undefined)return startQ(+t.dataset.q);
  const a=t.dataset.act;
  if(a==='go'){const nx=nextIdx();startQ(nx===-1?0:nx);}
  else if(a==='demo')startDemo();
  else if(a==='ask-clear'){confirmKind='clear';renderHome();}
  else if(a==='ask-new'){confirmKind='new';renderHome();}
  else if(a==='cancel'){confirmKind=null;renderHome();}
  else if(a==='do-clear'){store.results={};save();confirmKind=null;renderHome();}
  else if(a==='do-new'){store.seed=Math.floor(Math.random()*1e9)+1;store.results={};SET=genSet(store.seed);save();confirmKind=null;renderHome();}
});

/* ---------- play ---------- */
function buildPlay(){
  $('#play').innerHTML=`
  <header class="ptop">
    <button class="back" data-act="home">← All questions</button>
    <div class="pinfo"><div class="pq" id="pq"></div><div class="plev" id="plev"></div></div>
    <button class="iconBtn" id="mute" aria-label="Sound on or off"></button>
  </header>
  <div class="pbar"><i id="pbar"></i></div>
  <div class="pgrid">
    <div class="leftCol"><div class="paperWrap" id="paper"></div><div class="ladder" id="ladder"></div></div>
    <div class="rightCol">
      <div class="prompt" id="prompt" aria-live="polite"></div>
      <div class="keys" id="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}
        <button class="key" data-k="del" aria-label="Delete">⌫</button><button class="key" data-k="0">0</button><button class="key go" data-k="go" id="goKey">Check</button></div>
    </div>
  </div>`;
}
function playCell(){
  const w=$('#paper').clientWidth-8,{cols,rows}=dims(P);
  const byW=Math.floor(w/(cols+2)),byH=Math.floor((innerWidth>840?innerHeight*.66:innerHeight*.5)/(rows+2));
  return Math.max(22,Math.min(56,byW,Math.max(30,byH)));
}
function renderSheet(){$('#paper').innerHTML=sheetHTML(P,S,playCell());}
function chipsHTML(){
  return `<div class="chips">${['divide','multiply','subtract','bring'].map(p=>{
    const cls=S.phase==='finish'?'did':(p===S.phase?'on':(ORD[p]<ORD[S.phase]?'did':''));
    return `<div class="chip ${cls}" style="--x:var(--${COL[p]});--x-soft:var(--${COL[p]}-soft)">${NAME[p]}</div>`;}).join('')}</div>`;
}
function promptHTML(){
  const s=P.steps[S.k],d=P.d,ph=S.phase;
  let h=chipsHTML();
  if(S.demo)h+=`<p class="demoTag">Example: just watch how it works</p>`;
  if(ph==='finish')return h+finishHTML();
  if(ph==='estimate'){
    h+=`<div class="ask est">Estimate first</div><p class="sub">About how big will the answer to ${P.Ntxt} ÷ ${d} be?</p>
      <div class="estOpts">${P.est.opts.map(v=>`<button class="estBtn" data-est="${v}"${S.estTried.includes(v)||S.demo?' disabled':''}><small>about</small><b>${v}</b></button>`).join('')}</div>`;
    if(S.hint)h+=`<p class="hint">${S.hint}</p>`;
    return h;
  }
  if(S.note)h+=`<p class="note">${TICK}<span>${S.note}</span></p>`;
  const x=`style="--x:var(--${COL[ph]});--x-soft:var(--${COL[ph]}-soft)"`;
  const n=v=>`<span class="n">${v}</span>`;
  if(ph==='divide'){
    if(S.k===0&&P.startCol>0)h+=`<p class="pre">${d} can’t go into ${P.digits.slice(0,P.startCol).join('')}, so start with <b>${s.cur}</b>.</p>`;
    if(S.k===0&&P.dp)h+=`<p class="pre">The decimal point goes straight up into the answer, above the point in ${P.Ntxt}.</p>`;
    if(d>=10){h+=`<div ${x}><div class="ask">How many ${n(d)}s can you take away from ${n(s.cur)}?</div></div><p class="sub">Find the biggest one in the ladder that isn’t more than ${s.cur}.</p>`;}
    else h+=`<div ${x}><div class="ask">How many ${n(d)}s fit into ${n(s.cur)}?</div></div>`;
  }else if(ph==='multiply'){
    h+=`<div ${x}><div class="ask">${n(s.q)} × ${n(d)} = ?</div></div><p class="sub">Write it under ${s.curStr}.</p>`;
  }else if(ph==='subtract'){
    h+=`<div ${x}><div class="ask">${n(s.cur)} − ${n(s.prod)} = ?</div></div><p class="sub">How much is left over?</p>`;
  }else if(ph==='bring'){
    const dg=P.digits[s.col+1];
    h+=`<div ${x}><div class="ask">Bring down the ${n(dg)}</div></div><p class="sub">It goes next to the ${s.rem}, making ${s.rem*10+dg}.</p>`;
    if(!S.demo)h+=`<button class="big bringBtn" data-act="bring">Bring it down ↓</button>`;
    return h;
  }
  h+=`<div class="ansRow" ${x}><span class="lbl">Answer</span><span class="ans${S.shake?' shake':''}">${S.input}</span></div>`;
  if(S.hint)h+=`<p class="hint${S.hintInfo?' info':''}">${S.hint}</p>`;
  if(!S.demo)h+=`<div class="pbtns"><span></span><button class="link" data-act="show">Show me this step</button></div>`;
  return h;
}
function finishHTML(){
  const st=S.done?S.done.stars:3;
  const stars=`<div class="stars" aria-label="${st} stars">${[0,1,2].map(i=>`<svg viewBox="0 0 24 24" class="${i<st?'on pop':'off'}" style="animation-delay:${i*.12}s">${STAR}</svg>`).join('')}</div>`;
  const res=`<div class="res">${P.Ntxt} ÷ ${P.d} = <b>${P.Qtxt}</b>${P.R?` <em>R${P.R}</em>`:''}</div>`;
  const chk=(P.R?`Check: ${P.Q} × ${P.d} = ${P.Q*P.d}, plus ${P.R} left over = <b>${P.Ntxt}</b> ✓`:`Check: ${P.Qtxt} × ${P.d} = <b>${P.Ntxt}</b> ✓`)
    +`<br>Estimate was <i>about ${P.est.E}</i>, and ${P.Qtxt} is close to it ✓`;
  if(S.demo){
    const nx=nextIdx();
    return `<div class="done">${res}<p class="chk">${chk}</p><p class="msg">That’s the whole method. Your turn!</p><button class="big" data-act="mine">Start question ${(nx===-1?0:nx)+1} →</button></div>`;
  }
  const msg=st===3?'Perfect. No slips!':st===2?'Nice work!':'Done! Come back later to win more stars.';
  let lv='';
  if((idx+1)%20===0){const li=Math.floor(idx/20);lv=`<p class="lvlDone">Level ${li+1} complete!${li<4?` Next up: ${LEVELS[li+1].name}.`:' That was the last level.'}</p>`;}
  return `<div class="done">${stars}${res}<p class="chk">${chk}</p><p class="msg">${msg}</p>${lv}<button class="big" data-act="next">${idx===99?'Back to all questions':'Next question →'}</button></div>`;
}
function renderLadder(){
  const d=P.d,s=P.steps[S.k],showQ=['multiply','subtract','bring'].includes(S.phase)?s.q:-1;
  $('#ladder').innerHTML=`<div class="ladHead"><h3>${d} times table</h3><button class="link" data-act="ladder">${ladderOpen?'Hide':'Show'}</button></div>`+
    (ladderOpen?(d>=10?`<p class="ladCap">Long division is quick repeated subtraction: take away as many ${d}s as you can.</p>`:'')+
    `<div class="ladGrid">${[1,2,3,4,5,6,7,8,9].map(m=>`<div class="lc${m===showQ?' on':''}"><span>${m} ×</span>${m*d}</div>`).join('')}</div>`:'');
}
function renderKeys(){
  const typing=['divide','multiply','subtract'].includes(S.phase),go=$('#goKey');
  document.querySelectorAll('#keys .key').forEach(b=>{b.disabled=S.demo||S.phase==='estimate'||(!typing&&b.dataset.k!=='go');});
  go.classList.toggle('bring',S.phase==='bring');
  go.textContent=S.phase==='bring'?'↓':S.phase==='finish'?'Next':'Check';
}
function renderPlay(){
  const li=Math.floor(idx/20);
  $('#pq').textContent=S.demo?`Example: ${P.Ntxt} ÷ ${P.d}`:`Question ${idx+1} of 100`;
  $('#plev').textContent=S.demo?'Estimate, then the four moves':`Level ${li+1} · ${LEVELS[li].name} · ${LEVELS[li].tag}`;
  $('#pbar').style.width=Object.keys(store.results).length+'%';
  $('#mute').innerHTML=store.muted?SPK_OFF:SPK_ON;
  renderSheet();
  $('#prompt').innerHTML=promptHTML();
  renderKeys();renderLadder();
  S.fresh=new Set();S.drop=null;S.shake=false;
}

function correct(){const s=P.steps[S.k];return S.phase==='divide'?s.q:S.phase==='multiply'?s.prod:s.rem;}
function maxLen(){const s=P.steps[S.k];return S.phase==='divide'?1:S.phase==='multiply'?s.curStr.length+1:s.curStr.length;}
function hintFor(g){
  const s=P.steps[S.k],d=P.d;let t;
  if(S.phase==='divide'){
    t=g*d>s.cur?`Too many. ${g} × ${d} = ${g*d}, which is bigger than ${s.cur}.`
      :`Not enough. ${g} × ${d} = ${g*d}, which leaves ${s.cur-g*d}. That’s still ${d} or more, so you can take away another ${d}.`;
  }else if(S.phase==='multiply'){
    if(s.q===0)t='Anything times 0 is 0.';
    else if(d>=10){const T=Math.floor(d/10)*10,O=d%10;t=`Split it up: ${s.q} × ${T} = ${s.q*T}`+(O?` and ${s.q} × ${O} = ${s.q*O}. Add them together.`:'.');}
    else t=`Count up in ${d}s, ${s.q} times: ${s.q===1?d:d+', '+2*d+(s.q>2?', …':'')}`;
  }else t=`Not quite. Count up from ${s.prod} to ${s.cur}. How big is the jump?`;
  if(S.stepWrong>=2)t+=' Stuck? Tap “Show me this step”.';
  return t;
}
function recap(ph,s){
  const d=P.d;
  if(ph==='divide')return s.q===0?`${d} is bigger than ${s.cur}, so it fits 0 times.`:`${d} fits into ${s.cur} ${s.q} time${s.q>1?'s':''}. (${s.q+1} × ${d} = ${(s.q+1)*d} would be too many.)`;
  if(ph==='multiply')return `${s.q} × ${d} = ${s.prod}.`;
  if(ph==='subtract')return `${s.cur} − ${s.prod} = ${s.rem}.`;
  const dg=P.digits[s.col+1];return `Brought down the ${dg}. Now we have ${s.rem*10+dg}.`;
}
function estimateNote(){const e=P.est;return `${P.Ntxt} ÷ ${P.d} is about ${e.Nc} ÷ ${e.dR} = ${e.E2}`+(e.E2!==e.E?`, so roughly ${e.E}.`:`. Expect an answer near ${e.E}.`);}
function chooseEst(v){
  if(S.phase!=='estimate')return;
  if(v===P.est.E){S.note=estimateNote();S.hint='';S.phase='divide';sGood();renderPlay();return;}
  if(!S.estTried.includes(v)){S.estTried.push(v);S.wrong++;S.errs.estimate++;}
  const e=P.est;
  S.hint=(P.d>=10?`Round ${P.d} to ${e.dR}. `:'')+`${P.Ntxt} is close to ${e.Nc}. What’s ${e.Nc} ÷ ${e.dR}? Pick the option nearest to that.`;
  sBad();renderPlay();
}
function advance(){
  const j=S.k,s=P.steps[j],ph=S.phase;
  S.input='';S.hint='';S.hintInfo=false;S.stepWrong=0;S.note=recap(ph,s);
  if(ph==='divide'){S.phase='multiply';S.fresh=new Set(['q'+j]);}
  else if(ph==='multiply'){S.phase='subtract';S.fresh=new Set(['p'+j]);}
  else if(ph==='subtract'){S.fresh=new Set(['r'+j]);if(j===P.steps.length-1){S.phase='finish';S.fresh.add('R');finishQ();}else S.phase='bring';}
  renderPlay();
}
function doBring(){
  const j=S.k,s=P.steps[j];S.note=recap('bring',s);S.k++;S.phase='divide';S.drop='b'+j;S.fresh=new Set(['b'+j]);sDrop();renderPlay();
}
function submit(){
  if(S.phase==='estimate')return;
  if(S.phase==='bring')return doBring();
  if(S.phase==='finish')return S.demo?null:nextQ();
  if(S.input===''){S.hint='Type your answer on the keypad, then press Check.';S.hintInfo=true;renderPlay();return;}
  const g=parseInt(S.input,10);
  if(g===correct()){sGood();advance();}
  else{S.wrong++;S.errs[S.phase]++;S.stepWrong++;S.hint=hintFor(g);S.hintInfo=false;S.shake=true;S.input='';sBad();renderPlay();}
}
function showMe(){S.helps++;sGood();advance();}
function finishQ(){
  const pen=S.wrong+2*S.helps,stars=pen===0?3:pen<=2?2:1;S.done={stars};
  if(!S.demo){const prev=store.results[idx];
    store.results[idx]={first:prev?prev.first:{w:S.wrong,h:S.helps,e:{...S.errs},s:stars},best:Math.max(stars,prev?prev.best:0)};save();}
  setTimeout(()=>{confetti(stars===3||S.demo);sWin(stars);},280);
}
function press(k){
  if(S.demo)return;
  if(S.phase==='estimate'){const i=+k-1;if(i>=0&&i<3)chooseEst(P.est.opts[i]);return;}
  if(k==='go')return submit();
  if(!['divide','multiply','subtract'].includes(S.phase))return;
  if(k==='del')S.input=S.input.slice(0,-1);
  else{const m=maxLen();if(m===1)S.input=k;else if(S.input.length<m)S.input+=k;}
  renderSheet();$('#prompt').innerHTML=promptHTML();S.fresh=new Set();S.drop=null;S.shake=false;
}

function show(which){screen=which;$('#home').hidden=which!=='home';$('#play').hidden=which!=='play';window.scrollTo({top:0});}
function startQ(i){demoToken++;idx=i;P=solve(SET[i]);S=blank(false);ladderOpen=P.d>=10;buildPlay();show('play');renderPlay();}
function nextQ(){if(idx>=99)return goHome();startQ(idx+1);}
function goHome(){demoToken++;confirmKind=null;renderHome();show('home');}
async function startDemo(){
  const token=++demoToken;P=solve(DEMO);S=blank(true);ladderOpen=true;buildPlay();show('play');renderPlay();
  await wait(2600);if(token!==demoToken)return;
  S.note=estimateNote();S.phase='divide';sGood();renderPlay();
  while(token===demoToken&&S.phase!=='finish'){
    if(S.phase==='bring'){await wait(2400);if(token!==demoToken)return;doBring();continue;}
    await wait(2200);if(token!==demoToken)return;
    for(const ch of String(correct())){S.input+=ch;renderSheet();$('#prompt').innerHTML=promptHTML();await wait(320);if(token!==demoToken)return;}
    await wait(700);if(token!==demoToken)return;sGood();advance();
  }
}

document.addEventListener('click',e=>{
  if(screen!=='play')return;
  if(e.target.closest('#mute')){store.muted=!store.muted;save();$('#mute').innerHTML=store.muted?SPK_OFF:SPK_ON;return;}
  const k=e.target.closest('[data-k]');if(k)return press(k.dataset.k);
  const est=e.target.closest('[data-est]');if(est&&!S.demo)return chooseEst(+est.dataset.est);
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='home')goHome();
  else if(act==='bring')doBring();
  else if(act==='show')showMe();
  else if(act==='next')nextQ();
  else if(act==='mine'){const nx=nextIdx();startQ(nx===-1?0:nx);}
  else if(act==='ladder'){ladderOpen=!ladderOpen;renderLadder();}
});
document.addEventListener('keydown',e=>{
  if(screen!=='play')return;
  if(e.key==='Escape')return goHome();
  if(S.demo)return;
  if(/^[0-9]$/.test(e.key)){press(e.key);e.preventDefault();}
  else if(e.key==='Backspace'){press('del');e.preventDefault();}
  else if(e.key==='Enter'){press('go');e.preventDefault();}
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(screen==='play')renderSheet();},120);});

renderHome();
})();
</script>
<script>
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
